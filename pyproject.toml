# Tooling config only; the add-on and the integration are not Python packages.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Baseline the existing code meets; tighten as the code is refactored.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Imports follow an optional PIL import guard.
"theframe_controller/app/theframe.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
