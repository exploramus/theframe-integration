name: Release

# Push a tag vX.Y.Z whose version matches theframe_controller/config.yaml and
# custom_components/theframe/manifest.json. Publishes the add-on images to GHCR
# and a GitHub release (used by HACS).

on:
  push:
    tags: ["v*"]

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - run: pytest tests/test_versions.py
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  addon-image:
    name: Add-on image ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./theframe_controller
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/theframe-controller-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/theframe-controller-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=The Frame Controller
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}

  github-release:
    name: GitHub release
    needs: addon-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
