show_file:
  name: Show file
  description: Display a specific image file on The Frame.
  fields:
    file_name:
      name: File name
      description: File name as known to the add-on (e.g. "sunset.jpg").
      required: true
      example: sunset.jpg
      selector:
        text:

show_image:
  name: Show image
  description: Display a specific image by Samsung content ID.
  fields:
    content_id:
      name: Content ID
      description: Content ID returned by the TV.
      required: true
      example: MY_F0001
      selector:
        text:

sync_files:
  name: Sync files
  description: Compare the local image folder with the TV and reconcile.

next:
  name: Next image
  description: Advance the slideshow to the next image.

previous:
  name: Previous image
  description: Go back to the previous slideshow image.

play_files:
  name: Play files
  description: >-
    Load an ordered list of file names as the active slideshow (a curated
    "playlist"). Subsequent next / previous / interval-based advances walk
    through this list. Files not currently uploaded to the TV are skipped
    with a warning in the log.
  fields:
    file_names:
      name: File names
      description: Ordered list of file names exactly as known to the add-on.
      required: true
      example: "[sunset_01.jpg, harbor_evening.jpg, lighthouse.jpg]"
      selector:
        text:
          multiple: true
    slideshow_index:
      name: Start index
      description: Which item in the list to start at (0-based).
      default: 0
      selector:
        number:
          min: 0
          mode: box
    start:
      name: Show immediately
      description: >-
        Show the first item right away after loading. If false, the playlist
        is loaded but nothing is shown until the slideshow timer fires or
        next / previous is called.
      default: true
      selector:
        boolean:

save_collection:
  name: Save collection
  description: >-
    Save a named slideshow preset (a "collection") in the add-on: a set of
    keywords or an ordered list of files. Without keywords or files, the
    current slideshow is saved. Saving under an existing name replaces it.
    Collections appear as options of the Collection select (one tile in
    Apple Home).
  fields:
    name:
      name: Name
      description: Name of the collection, e.g. "Ameland" (no slashes).
      required: true
      example: Ameland
      selector:
        text:
    keywords:
      name: Keywords
      description: Show images with any of these keywords.
      example: "[Himmel, ShoreShades]"
      selector:
        text:
          multiple: true
    file_names:
      name: File names
      description: Show these files in this order (a playlist).
      example: "[DSC_3218.jpeg, IMG_2809.jpeg]"
      selector:
        text:
          multiple: true

delete_collection:
  name: Delete collection
  description: >-
    Delete a collection. If it is the active one, the slideshow keeps
    showing the same images.
  fields:
    name:
      name: Name
      description: Name of the collection.
      required: true
      example: Ameland
      selector:
        text:
