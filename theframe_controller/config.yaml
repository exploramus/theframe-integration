name: "The Frame Controller"
version: "1.1.0"
slug: theframe_controller
url: "https://github.com/exploramus/theframe-integration"
image: "ghcr.io/exploramus/theframe-controller-{arch}"
description: >-
  "Control Samsung The Frame in Art Mode with this add-on."
arch:
  - aarch64
  - amd64
startup: "services"
options:
  token_file: "/media/TheFrame/tv-token.txt"
  json_path: "/media/TheFrame/uploaded_files.json"
  image_path: "/media/TheFrameImages/"
  matte: "none"
  tv_connect_timeout: 15
  tv_connect_interval: 2
schema:
  token_file: str
  tv_ip: str
  tv_mac: "str?"
  json_path: str
  image_path: str
  matte: str
  tv_connect_timeout: int
  tv_connect_interval: int
map:
  - type: share
    read_only: False
    path: /share/
  - type: media
    read_only: False
    path: /media/
  - type: homeassistant_config
    read_only: False
    path: /config
ports:
  5000/tcp: 5000
